<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laufe mit deiner Figur über die JumpNRun-Strecke.">
    <title>JumpNRun | Zukunftstag</title>
    <link rel="stylesheet" href="game-navigation.css">
    <script src="jumpnrun.js" defer></script>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172554;
            background: #eff6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top, #dbeafe, #eff6ff 55%);
        }

        .game-card {
            width: min(100%, 38rem);
            padding: clamp(1.5rem, 6vw, 2.5rem);
            text-align: center;
            background: #fff;
            border: 1px solid #dbeafe;
            border-radius: 1.5rem;
            box-shadow: 0 1.5rem 4rem rgb(30 64 175 / 12%);
        }

        .eyebrow {
            margin: 0 0 0.5rem;
            color: #2563eb;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 2.75rem);
        }

        .instructions {
            margin: 0.75rem 0 1.25rem;
            color: #64748b;
        }

        .runner-stage {
            position: relative;
            width: 100%;
            height: clamp(12rem, 45vw, 18rem);
            overflow: hidden;
            border-radius: 1rem;
            background: linear-gradient(#bae6fd 0%, #dbeafe 72%, #bbf7d0 72%, #86efac 100%);
            touch-action: none;
        }

        .ground {
            position: absolute;
            right: 0;
            bottom: 1.5rem;
            left: 0;
            height: 0.4rem;
            background: repeating-linear-gradient(90deg, #15803d 0 1.2rem, #16a34a 1.2rem 2.4rem);
            background-position-x: 0;
        }

        .obstacle {
            position: absolute;
            bottom: 1.9rem;
            width: 1.75rem;
            height: 2.125rem;
            border: 2px solid #92400e;
            border-radius: 0.35rem 0.35rem 0.15rem 0.15rem;
            background: repeating-linear-gradient(135deg, #f97316 0 0.45rem, #fed7aa 0.45rem 0.9rem);
        }

        .runner {
            position: absolute;
            top: 0;
            left: 0;
            width: 3rem;
            height: 3.5rem;
            font-size: 3rem;
            line-height: 1;
            user-select: none;
        }

        .runner > span {
            display: inline-block;
            transform: scaleX(-1);
        }

        .movement-status {
            min-height: 1.5rem;
            margin: 0.75rem 0;
            color: #334155;
            font-weight: 700;
        }

        .movement-controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 5rem));
            grid-template-rows: 3.5rem;
            justify-content: center;
            gap: 0.5rem;
        }

        .movement-controls button,
        .restart-game {
            min-width: 0;
            border: 0;
            border-radius: 0.75rem;
            padding: 0.8rem 1rem;
            background: #1d4ed8;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        .movement-controls [data-direction="left"] {
            grid-column: 1;
        }

        .movement-controls [data-direction="up"] {
            grid-column: 2;
        }

        .movement-controls [data-direction="right"] {
            grid-column: 3;
        }

        .movement-controls button:hover,
        .restart-game:hover {
            background: #1e40af;
        }

        .movement-controls button:focus-visible,
        .restart-game:focus-visible {
            outline: 3px solid #f59e0b;
            outline-offset: 3px;
        }

        .restart-game {
            margin-top: 0.75rem;
            border-radius: 999px;
            padding: 0.75rem 1.25rem;
        }

    </style>
</head>
<body>
    <main class="game-card">
        <nav class="game-picker" aria-label="Spiel auswählen">
            <a href="index.html">Tic-Tac-Toe</a>
            <a class="is-current" href="jumpnrun.html" aria-current="page">JumpNRun</a>
        </nav>
        <p class="eyebrow">Zukunftstag</p>
        <h1>JumpNRun</h1>
        <p class="instructions">Die Strecke läuft von selbst. Springe mit Leertaste, Pfeil nach oben oder W über Hindernisse. Links und rechts bewegst du die Figur.</p>
        <div id="runner-stage" class="runner-stage" role="group" aria-label="Laufstrecke">
            <div class="ground" aria-hidden="true"></div>
            <div class="obstacle" data-obstacle aria-hidden="true"></div>
            <div class="obstacle" data-obstacle aria-hidden="true"></div>
            <div class="obstacle" data-obstacle aria-hidden="true"></div>
            <div id="runner" class="runner" aria-hidden="true"><span>🐢</span></div>
        </div>
        <p id="movement-status" class="movement-status" role="status" aria-live="polite">Die Strecke läuft. Springe über die Hindernisse!</p>
        <div class="movement-controls" role="group" aria-label="Bewegungssteuerung">
            <button type="button" data-direction="left" aria-label="Nach links laufen">← Links</button>
            <button type="button" data-direction="up" aria-label="Springen">↑ Springen</button>
            <button type="button" data-direction="right" aria-label="Nach rechts laufen">Rechts →</button>
        </div>
        <button id="restart-game" class="restart-game" type="button">Neustart</button>
    </main>
</body>
</html>
